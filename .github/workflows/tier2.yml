name: Tier 2

# Builds and tests the platforms and configurations Tier 1 does not, on a
# maintainer's request. Only an account with write access can start this
# workflow. It holds no secrets and its token can only read the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux-arm64:
    name: Build and test (Linux arm64)
    runs-on: ubuntu-24.04-arm
    # Without the x86-64 JIT the suite takes over two hours on this runner,
    # as in release.yml (docs/ContinuousIntegration.md, "Time limits").
    timeout-minutes: 360
    env:
      CC: gcc-14
      CXX: g++-14
      NEURA_LIBCLANG_REQUIRED: "1"
      NEURA_USERNS_REQUIRED: "1"
    steps:
      - name: Check out the repository and its submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-14 g++-14 libffi-dev libclang1-19 libclang-common-19-dev

      - name: Describe the machine
        run: |
          uname -a
          "$CXX" --version
          cmake --version
          ldd --version | head -1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEURA_TEST_TIMEOUT_SCALE=12 -DNEURA_TEST_FRAME_HOOKS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)" 2>&1 | tee build/build.log

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        run: >
          ctest --test-dir build --parallel "$(nproc)" --no-tests=error
          --output-on-failure --output-junit ctest-junit.xml

      - name: Upload the build log and the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier2-linux-arm64
          path: |
            build/build.log
            build/ctest-junit.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

  macos:
    name: Build and test (macOS ${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    # Without the x86-64 JIT the suite takes hours on these runners. The
    # time-limit scale and the crypto suites the Intel runner leaves to the
    # other targets follow release.yml (docs/ContinuousIntegration.md, "Time
    # limits" and "Tests that run on fewer targets").
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            exclude: "^$"
          - architecture: x86-64
            runner: macos-15-intel
            exclude: "^(stdlib-crypto-advanced|stdlib-crypto-asymmetric|stdlib-crypto-pqc(-.*)?)$"
    env:
      NEURA_LIBCLANG_REQUIRED: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out the repository and its submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the build dependencies
        run: |
          brew install libffi pkgconf gnu-tar
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Describe the machine
        run: |
          uname -a
          sw_vers
          c++ --version
          cmake --version
          xcode-select --print-path

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEURA_TEST_TIMEOUT_SCALE=12 -DNEURA_TEST_FRAME_HOOKS=ON

      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee build/build.log

      - name: Test
        env:
          EXCLUDE: ${{ matrix.exclude }}
        run: >
          ctest --test-dir build --parallel "$(sysctl -n hw.ncpu)" --no-tests=error
          --output-on-failure --output-junit ctest-junit.xml -E "$EXCLUDE"

      # 174 = the historical 180-test floor on Linux without a GPU, less the 6
      # that need the Linux native launcher (native-build, native-run,
      # native-container, native-policy, native-install, native-c-import).
      - name: Require every test to have run
        if: ${{ !cancelled() }}
        run: python3 scripts/check-test-report.py build/ctest-junit.xml --minimum 174

      - name: Upload the build log and the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier2-macos-${{ matrix.architecture }}
          path: |
            build/build.log
            build/ctest-junit.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

  # The tests are split into six shards by CTest number, each built and run
  # by its own job: in two shards the 0.3.0 suite no longer fit the time
  # limits.
  sanitizers:
    name: Address and undefined-behavior sanitizers (Linux x86-64, shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      CC: gcc-14
      CXX: g++-14
      NEURA_LIBCLANG_REQUIRED: "1"
      # Tells the suites with a latency limit of their own that the build is
      # sanitized (tests/server/server_host_test.py).
      NEURA_TEST_SANITIZERS: "1"
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:abort_on_error=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out the repository and its submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-14 g++-14 libffi-dev libclang1-19 libclang-common-19-dev

      # A static executable cannot carry the sanitizer runtime, so the static
      # launcher and the static dispatcher are left out of this configuration.
      # Every time limit is multiplied by 6: at the usual limits 28 tests of
      # the 0.3.0 suite ran out of time here without a sanitizer report. With
      # the scale, each backend-reference-library shard inherits the former
      # suite's 5.5-hour limit (it ran for more than 3),
      # each decompiler behavior case inherits 3 hours (the former suite took
      # 2.6), and program-fuzz 2 hours
      # (it took 1). Keep the previous lifetime suite limit of 5 hours for
      # each independent fixture until the split entries have sanitizer data.
      # With NEURA_TEST_SANITIZERS they decompile only where a check needs the names.
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNEURA_TEST_FRAME_HOOKS=ON
          -DNEURA_STATIC_LAUNCHER=OFF
          -DNEURA_STATIC_DISPATCHER=OFF
          -DNEURA_TEST_TIMEOUT_SCALE=6
          -DNEURA_REFERENCE_TEST_TIMEOUT=3300
          -DNEURA_DECOMPILER_BEHAVIOR_TEST_TIMEOUT=1800
          -DNEURA_PROGRAM_FUZZ_TEST_TIMEOUT=1200
          -DNEURA_LIFETIME_PROGRAMS_TEST_TIMEOUT=3000
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel "$(nproc)" 2>&1 | tee build/build.log

      # Two tests cannot hold in this configuration and are left out.
      # native-install requires the default launcher to need only the C
      # library, and a sanitized launcher also needs the sanitizer runtime.
      # native-container rewrites an executable it has just run, and the leak
      # checker's helper process can still hold that file open ("Text file
      # busy").
      #
      # The stack is raised to 1 GiB because sanitized frames are several
      # times larger: backend-reference runs test programs 400 calls deep in
      # an evaluator that recurses on the native stack, and overflows the
      # default 8 MiB before the evaluator's own depth limit stops it.
      #
      # Under AddressSanitizer the NVM heap takes every entry from operator
      # new, which makes the tests that run many programs several times slower
      # than in a Release build: backend-placement and decompiler-lift each ran
      # for more than an hour.
      #
      # -I takes every sixth test, starting at the shard's number.
      - name: Test
        run: |
          ulimit -s 1048576
          ctest --test-dir build --parallel "$(nproc)" --no-tests=error \
            --output-on-failure --output-junit ctest-junit.xml \
            -I "${{ matrix.shard }},,6" -E "^(native-install|native-container)$"

      - name: Upload the build log and the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier2-sanitizers-${{ matrix.shard }}
          path: |
            build/build.log
            build/ctest-junit.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: Build and test (Windows ${{ matrix.preset }})
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc, windows-clang-cl]
    steps:
      - name: Keep LF line endings before checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out the repository and its submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select the Windows build environment
        uses: ./.github/actions/windows
      - name: Configure
        run: cmake --preset '${{ matrix.preset }}' -DNEURA_TEST_TIMEOUT_SCALE=12 -DNEURA_TEST_FRAME_HOOKS=ON
      - name: Build
        run: cmake --build --preset '${{ matrix.preset }}' --parallel 4 2>&1 | tee build-${{ matrix.preset }}/build.log
      - name: Require an MSVC build without Neura compiler warnings
        if: ${{ matrix.preset == 'windows-msvc' }}
        shell: pwsh
        run: ./.github/scripts/check-msvc-warnings.ps1 build-windows-msvc/build.log
      - name: Check the PE layout and execution-core closure
        run: |
          python scripts/check-windows-binaries.py build-${{ matrix.preset }}
          python scripts/check-core-closure.py build-${{ matrix.preset }}
          sh scripts/check-kernels.sh build-${{ matrix.preset }}
      # The crypto suites that x86-64 macOS leaves out are left out here too:
      # without the JIT stdlib-crypto-asymmetric alone runs for hours
      # (docs/ContinuousIntegration.md, "Tests that run on fewer targets").
      # The historical floor is 321, the original 327 Windows tests less those six.
      - name: Test
        run: >
          ctest --test-dir build-${{ matrix.preset }} --parallel 6 --no-tests=error
          --output-on-failure --output-junit ctest-junit.xml
          -E "^(stdlib-crypto-advanced|stdlib-crypto-asymmetric|stdlib-crypto-pqc(-.*)?)$"
      - name: Require every registered test to have run
        if: ${{ !cancelled() }}
        run: python scripts/check-test-report.py build-${{ matrix.preset }}/ctest-junit.xml --minimum 321
      - name: Upload the build and test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier2-${{ matrix.preset }}
          path: |
            build-${{ matrix.preset }}/build.log
            build-${{ matrix.preset }}/ctest-junit.xml
            build-${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30
