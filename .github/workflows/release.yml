name: Release

# Tier 3: release qualification. A v* tag builds every supported target from
# the tagged commit, tests it, packs it, and runs the lifecycle checks on the
# packed archive on a second, new runner. Only then does the publish job run,
# and it is the only job with a token that can write: it belongs to the
# protected `release` environment, which a maintainer approves for each run.
#
# Started by hand, the workflow builds and qualifies the chosen ref as a
# `-dev` version and publishes nothing. That is how a change to this file is
# tried before a tag is spent on it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      full: ${{ steps.plan.outputs.full }}
      previous: ${{ steps.previous.outputs.tag }}
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide the version
        id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            if ! python3 scripts/check-release-tag.py "$REF_NAME" > plan.txt; then
              cat plan.txt
              exit 1
            fi
          else
            version=$(cat VERSION)
            printf 'version=%s\nprerelease=dev\nfull=%s-dev\n' "$version" "$version" > plan.txt
          fi
          cat plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"

      # The most recent published release, release candidates included, is
      # the version the upgrade check starts from.
      - name: Find the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # A trial builds a -dev version, which sorts before every published
          # candidate of the same version, so it has nothing to update from.
          if [ "$REF_TYPE" = tag ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 --json tagName \
              --jq "[.[].tagName | select(. != \"$REF_NAME\")][0] // \"\"")
          else
            tag=""
          fi
          echo "previous release: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.triple }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-linux-gnu
            runner: ubuntu-24.04
            minimum: 159
            exclude: "^$"
          # neura-libclang-load, a test of the neura-libclang submodule,
          # expects `char` to be signed, which it is not on arm64.
          - triple: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            minimum: 158
            exclude: "^neura-libclang-load$"
          # macOS has no native launcher, so the six native-* tests are not
          # registered there.
          - triple: aarch64-apple-darwin
            runner: macos-15
            minimum: 153
            exclude: "^$"
          - triple: x86_64-apple-darwin
            runner: macos-15-intel
            minimum: 153
            exclude: "^$"
    env:
      NEURA_LIBCLANG_REQUIRED: "1"
      NEURA_USERNS_REQUIRED: "1"
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      FULL: ${{ needs.plan.outputs.full }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - name: Check out the repository and its submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the build dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-14 g++-14 libffi-dev libclang1-19 libclang-common-19-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          echo "JOBS=$(nproc)" >> "$GITHUB_ENV"

      # libffi's static library is linked into neura, so the archive does not
      # need Homebrew on the machine it is installed on.
      - name: Install the build dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install libffi pkgconf gnu-tar
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DNEURA_PORTABLE_RELEASE=ON
          "-DNEURA_VERSION_PRERELEASE=$PRERELEASE"
          "-DNEURA_BUILD_COMMIT=$GITHUB_SHA"

      - name: Build
        run: cmake --build build --parallel "$JOBS" 2>&1 | tee build/build.log

      - name: Require a build of Neura's sources without compiler warnings
        run: |
          if grep -F "warning:" build/build.log | grep -v -F "/third_party/"; then
            echo "::error::The build reported the compiler warnings above in Neura's sources."
            exit 1
          fi

      - name: Allow unprivileged user namespaces
        if: ${{ runner.os == 'Linux' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        env:
          EXCLUDE: ${{ matrix.exclude }}
        run: >
          ctest --test-dir build --parallel "$JOBS" --no-tests=error
          --output-on-failure --output-junit ctest-junit.xml -E "$EXCLUDE"

      - name: Require every test to have run
        if: ${{ !cancelled() }}
        env:
          MINIMUM: ${{ matrix.minimum }}
        run: python3 scripts/check-test-report.py build/ctest-junit.xml --minimum "$MINIMUM"

      - name: Install into a new prefix
        run: cmake --install build --prefix stage

      # The archive must run on a machine without a C++ runtime or libffi,
      # with a C library no newer than the one documented in docs/Install.md.
      - name: Require the documented system dependencies and no others (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          status=0
          for file in stage/bin/neura stage/lib/neura/launchers/*/*; do
            # A static executable has no dynamic section: readelf prints
            # nothing for it and objdump fails. Both mean it needs nothing.
            needed=$(readelf -d "$file" 2> /dev/null | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort | tr '\n' ' ' || true)
            newest=$(objdump -T "$file" 2> /dev/null | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -n 1 || true)
            echo "$file: needs ${needed:-nothing}; newest symbol version ${newest:-none}"
            for library in $needed; do
              case "$library" in
                libc.so.6|libm.so.6|ld-linux-x86-64.so.2|ld-linux-aarch64.so.1) ;;
                *) echo "::error::$file needs $library"; status=1 ;;
              esac
            done
            if [ -n "$newest" ] && [ "$(printf '%s\nGLIBC_2.39\n' "$newest" | sort -V | tail -n 1)" != "GLIBC_2.39" ]; then
              echo "::error::$file needs $newest, newer than GLIBC_2.39"
              status=1
            fi
          done
          exit "$status"

      # On macOS the archive may need only libraries that are part of the
      # system: everything under /usr/lib and /System.
      - name: Require the documented system dependencies and no others (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          status=0
          otool -L stage/bin/neura
          for library in $(otool -L stage/bin/neura | tail -n +2 | awk '{ print $1 }'); do
            case "$library" in
              /usr/lib/*|/System/*) ;;
              *) echo "::error::stage/bin/neura needs $library"; status=1 ;;
            esac
          done
          echo "minimum macOS version: $(otool -l stage/bin/neura | awk '/LC_BUILD_VERSION/ { found = 1 } found && /minos/ { print $2; exit }')"
          exit "$status"

      - name: Require the built version to be the planned one
        run: |
          reported=$(stage/bin/neura --version)
          echo "$reported"
          case "$reported" in
            "neura $FULL ($TRIPLE, commit $GITHUB_SHA)") ;;
            *) echo "::error::expected neura $FULL ($TRIPLE, commit $GITHUB_SHA)"; exit 1 ;;
          esac

      - name: Pack the archive
        run: |
          mkdir dist
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) sh packaging/make-archive.sh stage dist "$FULL" "$TRIPLE"

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.triple }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build log and the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-build-${{ matrix.triple }}
          path: |
            build/build.log
            build/ctest-junit.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 90

  qualify:
    name: Qualify the archive (${{ matrix.triple }})
    needs: [plan, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-linux-gnu
            runner: ubuntu-24.04
          - triple: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
          - triple: aarch64-apple-darwin
            runner: macos-15
          - triple: x86_64-apple-darwin
            runner: macos-15-intel
    env:
      FULL: ${{ needs.plan.outputs.full }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      # Only the qualification script and the examples are used from the
      # checkout. Nothing is built on this runner.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.triple }}
          path: dist

      # A target that the previous release did not have has nothing to
      # update from, and its upgrade check is reported as not run.
      - name: Download the previous release's archive
        if: ${{ env.PREVIOUS != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous --pattern SHA256SUMS
          if grep -F -- "-$TRIPLE.tar.gz" previous/SHA256SUMS > previous/expected; then
            gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous \
              --pattern "neura-*-$TRIPLE.tar.gz"
            (cd previous && shasum -a 256 --check expected)
          else
            echo "$PREVIOUS has no archive for $TRIPLE"
          fi

      - name: Run the lifecycle checks
        run: |
          set -- --archive "dist/neura-$FULL-$TRIPLE.tar.gz" --version "$FULL" --triple "$TRIPLE" --examples examples
          previous=$(ls previous/neura-*-"$TRIPLE".tar.gz 2> /dev/null || true)
          if [ -n "$previous" ]; then
            set -- "$@" --previous "$previous" --require-previous
          fi
          sh packaging/qualify.sh "$@" | tee "qualify-$TRIPLE.txt"

      - name: Upload the qualification report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-qualify-${{ matrix.triple }}
          path: qualify-${{ matrix.triple }}.txt
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Publish
    if: ${{ github.ref_type == 'tag' }}
    needs: [plan, build, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      FULL: ${{ needs.plan.outputs.full }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the qualified archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Write the checksums and the update metadata
        run: |
          sh packaging/make-release-metadata.sh dist "$FULL"
          cat dist/SHA256SUMS dist/neura-release.txt

      # The one-line install command downloads this script from the release.
      - name: Add the install script
        run: cp packaging/bootstrap.sh dist/install.sh

      - name: Attest the build provenance of each file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Write the release notes
        run: python3 scripts/release-notes.py "$FULL" > notes.md

      # A release candidate is published as a prerelease at once. A final
      # version stays a draft: a maintainer publishes it after the manual
      # verification in docs/ReleaseProcess.md.
      - name: Create the release
        run: |
          if [ -n "$PRERELEASE" ]; then
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Neura $FULL" --notes-file notes.md --prerelease
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Neura $FULL" --notes-file notes.md --draft
          fi

      - name: Download the release's files and verify them
        run: |
          mkdir check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir check
          (cd check && sha256sum --check SHA256SUMS)
          for file in check/*.tar.gz; do
            cmp "$file" "dist/$(basename "$file")"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
          cmp check/neura-release.txt dist/neura-release.txt
          cmp check/install.sh dist/install.sh

      # A published release candidate can be downloaded by anyone, so the
      # documented install command is run against it as a user would. A final
      # version is still a draft here; docs/ReleaseProcess.md has the
      # maintainer run the command after publishing it.
      - name: Install the published candidate with the one-line command
        if: ${{ env.PRERELEASE != '' }}
        run: |
          home=$(mktemp -d)
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" |
            env -i HOME="$home" PATH=/usr/bin:/bin GH_TOKEN="$GH_TOKEN" sh -s -- --version "$FULL" | tee install.log
          # The token lets gh check the attestation, so the check must have run.
          grep -F "Verified: build provenance" install.log
          reported=$(env -i HOME="$home" PATH="$home/.local/bin:/usr/bin:/bin" neura --version)
          echo "$reported"
          case "$reported" in
            "neura $FULL (x86_64-linux-gnu, commit $GITHUB_SHA)") ;;
            *) echo "::error::the installed neura is not $FULL built from $GITHUB_SHA"; exit 1 ;;
          esac
          env -i HOME="$home" PATH="$home/.local/bin:/usr/bin:/bin" neura doctor
