name: Release

# Tier 3: release qualification. A v* tag builds every supported target from
# the tagged commit, tests it, packs it, and runs the lifecycle checks on the
# packed archive on a second, new runner. Only then does the publish job run,
# and it is the only job with a token that can write: it belongs to the
# protected `release` environment, which a maintainer approves for each run.
#
# Started by hand, the workflow builds and qualifies the chosen ref as a
# `-dev` version and publishes nothing. That is how a change to this file is
# tried before a tag is spent on it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      full: ${{ steps.plan.outputs.full }}
      previous: ${{ steps.previous.outputs.tag }}
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide the version
        id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! python3 scripts/check-release-tag.py "$REF_NAME" > plan.txt; then
              cat plan.txt
              exit 1
            fi
          else
            version=$(cat VERSION)
            printf 'version=%s\nprerelease=dev\nfull=%s-dev\n' "$version" "$version" > plan.txt
          fi
          cat plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"

      # The most recent published release, release candidates included, is
      # the version the upgrade check starts from.
      - name: Find the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # A trial builds a -dev version, which sorts before every published
          # candidate of the same version: it updates from the most recent
          # release of an earlier version, so check 9 runs in a trial as it
          # does for a tag whose previous release is of an earlier version.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 --json tagName \
              --jq "[.[].tagName | select(. != \"$REF_NAME\")][0] // \"\"")
          else
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 --json tagName \
              --jq "[.[].tagName | select(startswith(\"v$VERSION\") | not)][0] // \"\"")
          fi
          echo "previous release: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.triple }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    # The longest a hosted runner allows. Without the x86-64 JIT (aarch64
    # and macOS) the suite takes hours on the 3- and 4-core runners
    # (docs/ContinuousIntegration.md, "Time limits").
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # timeout-scale multiplies every test's time limit
        # (NEURA_TEST_TIMEOUT_SCALE); the limits are set for a developer
        # machine with the JIT.
        include:
          - triple: x86_64-linux-gnu
            runner: ubuntu-24.04
            minimum: 180
            exclude: "^$"
            timeout-scale: 3
          - triple: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            minimum: 180
            exclude: "^$"
            timeout-scale: 12
          # macOS has no native launcher, so the six native-* tests are not
          # registered there. Its runners have no Docker, which the
          # PostgreSQL provider's test starts its servers in: there it is
          # left out instead of being reported as skipped.
          - triple: aarch64-apple-darwin
            runner: macos-15
            minimum: 174
            exclude: "^server-sql-postgres$"
            timeout-scale: 12
          # The Intel runner runs the crypto suites five to six times slower than the arm one
          # (release trial 21), and its suite reaches the 360-minute job limit: the pure-Neura
          # suites stdlib-crypto-advanced, stdlib-crypto-asymmetric and stdlib-crypto-pqc with
          # its parts (hours each without the JIT) run on the other three targets, including arm macOS with
          # the same compiler, library and interpreter without the JIT
          # (docs/ContinuousIntegration.md, "Tests that run on fewer targets").
          - triple: x86_64-apple-darwin
            runner: macos-15-intel
            minimum: 174
            exclude: "^(server-sql-postgres|stdlib-crypto-advanced|stdlib-crypto-asymmetric|stdlib-crypto-pqc(-.*)?)$"
            timeout-scale: 12
          # Windows runs the interpreter. Tests for the deferred server
          # transports, PostgreSQL and native launcher are not registered.
          - triple: x86_64-windows-msvc
            runner: windows-2022
            minimum: 328
            exclude: "^$"
            timeout-scale: 12
    env:
      NEURA_LIBCLANG_REQUIRED: "1"
      NEURA_USERNS_REQUIRED: "1"
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      FULL: ${{ needs.plan.outputs.full }}
      TRIPLE: ${{ matrix.triple }}
      TIMEOUT_SCALE: ${{ matrix.timeout-scale }}
    steps:
      - name: Keep LF line endings before checkout
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out the repository and its submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the build dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-14 g++-14 libffi-dev libclang1-19 libclang-common-19-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
          echo "JOBS=$(nproc)" >> "$GITHUB_ENV"

      # libffi's static library is linked into neura, so the archive does not
      # need Homebrew on the machine it is installed on.
      - name: Install the build dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install libffi pkgconf gnu-tar
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

      - name: Select the Windows build environment
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/windows

      # The server components that each POSIX archive links statically: OpenSSL
      # (TLS), nghttp2 (HTTP/2) and libpq (the PostgreSQL provider), built
      # from the sources packaging/server-components.lock.toml pins
      # (docs/runtime/ServerHost.md, "Release archives"). For a tag only the
      # source archives are cached; the script checks each against the
      # lock's SHA-256 before it builds, so a restored cache cannot change
      # what is linked.
      - name: Restore the server component sources
        if: ${{ runner.os != 'Windows' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server-downloads
          key: server-sources-${{ hashFiles('packaging/server-components.lock.toml') }}

      # A trial started by hand may reuse the components an earlier trial
      # built on the same runner image from the same lock and script. A tag
      # always builds them from the verified sources.
      # The runner image (ImageOS, ImageVersion: variables of the runner's
      # environment, not of the workflow's env context) and the compiler are
      # part of the key.
      - name: Name the built server components (trials only)
        id: server-key
        if: ${{ runner.os != 'Windows' && github.event_name == 'workflow_dispatch' }}
        env:
          RECIPE: ${{ hashFiles('packaging/server-components.lock.toml', 'packaging/build-server-components.sh') }}
        run: |
          compiler=$("${CC:-cc}" --version 2> /dev/null | head -n 1 | tr -c 'A-Za-z0-9.\n' '-')
          key="server-built-$TRIPLE-${ImageOS:-unknown}-${ImageVersion:-unknown}-$compiler-$RECIPE"
          echo "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore the built server components (trials only)
        id: server-built
        if: ${{ runner.os != 'Windows' && github.event_name == 'workflow_dispatch' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/server-components
          key: ${{ steps.server-key.outputs.key }}

      - name: Build the server components
        if: ${{ runner.os != 'Windows' && steps.server-built.outputs.cache-hit != 'true' }}
        run: |
          sh packaging/build-server-components.sh --downloads server-downloads --jobs "$JOBS" \
            "$RUNNER_TEMP/server-components" 2>&1 | tee server-components.log

      # Saved at once, not at the end of the job, so a trial whose tests
      # fail still leaves the components for the next one.
      - name: Save the built server components (trials only)
        if: ${{ runner.os != 'Windows' && github.event_name == 'workflow_dispatch' && steps.server-built.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/server-components
          key: ${{ steps.server-key.outputs.key }}

      - name: Locate the server components
        if: ${{ runner.os != 'Windows' }}
        run: echo "SERVER_COMPONENTS=$RUNNER_TEMP/server-components" >> "$GITHUB_ENV"

      - name: Configure (Linux and macOS)
        if: ${{ runner.os != 'Windows' }}
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DNEURA_PORTABLE_RELEASE=ON
          "-DNEURA_VERSION_PRERELEASE=$PRERELEASE"
          "-DNEURA_BUILD_COMMIT=$GITHUB_SHA"
          -DNEURA_ENABLE_SERVER_TLS=ON "-DOPENSSL_ROOT_DIR=$SERVER_COMPONENTS/openssl"
          "-DOPENSSL_INCLUDE_DIR=$SERVER_COMPONENTS/openssl/include"
          -DNEURA_ENABLE_SERVER_HTTP2=ON "-DNEURA_NGHTTP2_ROOT=$SERVER_COMPONENTS/nghttp2"
          -DNEURA_ENABLE_POSTGRES=ON "-DNEURA_LIBPQ_SOURCE=$SERVER_COMPONENTS/postgresql"
          "-DNEURA_LIBPQ_BUILD=$SERVER_COMPONENTS/postgresql"
          "-DNEURA_COMPONENT_LICENSES=$SERVER_COMPONENTS/licenses"
          "-DNEURA_SERVER_TEST_OPENSSL=$SERVER_COMPONENTS/openssl/bin/openssl"
          "-DNEURA_TEST_TIMEOUT_SCALE=$TIMEOUT_SCALE"

      - name: Configure (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: >
          cmake --preset windows-release -B build
          "-DNEURA_VERSION_PRERELEASE=$env:PRERELEASE"
          "-DNEURA_BUILD_COMMIT=$env:GITHUB_SHA"
          "-DNEURA_TEST_TIMEOUT_SCALE=$env:TIMEOUT_SCALE"

      # The build must compile against and link the pinned libraries, never a
      # system or Homebrew OpenSSL: FindOpenSSL may take the headers from the
      # pkg-config file of Homebrew's OpenSSL, so the include directory is
      # given too.
      - name: Require the pinned server components
        if: ${{ runner.os != 'Windows' }}
        run: |
          status=0
          for entry in OPENSSL_SSL_LIBRARY OPENSSL_CRYPTO_LIBRARY OPENSSL_INCLUDE_DIR NEURA_NGHTTP2_LIBRARY; do
            value=$(sed -n "s/^$entry:[A-Z]*=//p" build/CMakeCache.txt)
            echo "$entry: $value"
            case "$value" in
              "$SERVER_COMPONENTS"/*) ;;
              *) echo "::error::$entry is $value, not under $SERVER_COMPONENTS"; status=1 ;;
            esac
          done
          "$SERVER_COMPONENTS/openssl/bin/openssl" version
          cat "$SERVER_COMPONENTS/components.txt"
          exit "$status"

      # The archives' OpenSSL takes its default trust anchors from /etc/ssl
      # (docs/Install.md): a verifying connection with no CA file given
      # shows that the runner's system keeps them there.
      - name: Require the default trust anchors to verify a public server
        if: ${{ runner.os != 'Windows' }}
        run: |
          ls -ld /etc/ssl/cert.pem /etc/ssl/certs 2> /dev/null || true
          echo | "$SERVER_COMPONENTS/openssl/bin/openssl" s_client -connect github.com:443 -servername github.com \
            -verify_return_error > trust.log 2>&1 || true
          grep -E "Verify return code" trust.log
          grep -q "Verify return code: 0 (ok)" trust.log

      - name: Build
        id: build
        run: cmake --build build --parallel "$JOBS" 2>&1 | tee build/build.log

      - name: Require a build of Neura's sources without compiler warnings
        if: ${{ runner.os != 'Windows' }}
        run: |
          if grep -F "warning:" build/build.log | grep -v -F "/third_party/"; then
            echo "::error::The build reported the compiler warnings above in Neura's sources."
            exit 1
          fi

      - name: Require an MSVC build without Neura compiler warnings
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: ./.github/scripts/check-msvc-warnings.ps1 build/build.log

      # The install and the checks of what it holds run before the tests and
      # whenever the build succeeded, so a failing or slow test does not hide
      # them; packing still needs every step.
      # stage holds the core and the SDK, for the dependency checks below;
      # `cmake --install` without a component leaves the service out
      # (docs/design/Service030.md). Each stage-<component> holds one install
      # component, which make-archive.sh packs into the target's archives
      # and describes with a manifest (docs/design/Lifecycle030.md).
      # stage-service is empty in a build without neurad.
      - name: Install into new prefixes
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cmake --install build --prefix stage
          for component in core sdk service; do
            cmake --install build --component "$component" --prefix "stage-$component"
            mkdir -p "stage-$component"
          done

      # The archive must run on a machine without a C++ runtime or libffi,
      # with a C library no newer than the one documented in docs/Install.md.
      - name: Require the documented system dependencies and no others (Linux)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          status=0
          # Every executable of the three archives: stage holds core and sdk,
          # stage-service the service component.
          for file in stage/bin/* stage/lib/neura/*.so stage/lib/neura/launchers/*/* $(find stage-service -type f 2> /dev/null); do
            # A static executable has no dynamic section: readelf prints
            # nothing for it and objdump fails. Both mean it needs nothing.
            needed=$(readelf -d "$file" 2> /dev/null | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort | tr '\n' ' ' || true)
            newest=$(objdump -T "$file" 2> /dev/null | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -n 1 || true)
            echo "$file: needs ${needed:-nothing}; newest symbol version ${newest:-none}"
            for library in $needed; do
              case "$library" in
                libc.so.6|libm.so.6|ld-linux-x86-64.so.2|ld-linux-aarch64.so.1) ;;
                # The tools' own libraries, shipped in lib/neura.
                "libneura-core-$FULL.so"|"libneura-sdk-$FULL.so") ;;
                *) echo "::error::$file needs $library"; status=1 ;;
              esac
            done
            if [ -n "$newest" ] && [ "$(printf '%s\nGLIBC_2.39\n' "$newest" | sort -V | tail -n 1)" != "GLIBC_2.39" ]; then
              echo "::error::$file needs $newest, newer than GLIBC_2.39"
              status=1
            fi
          done
          exit "$status"

      # On macOS the archive may need only libraries that are part of the
      # system: everything under /usr/lib and /System.
      - name: Require the documented system dependencies and no others (macOS)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          status=0
          for file in stage/bin/* stage/lib/neura/*.dylib $(find stage-service -type f 2> /dev/null); do
            otool -L "$file"
            for library in $(otool -L "$file" | tail -n +2 | awk '{ print $1 }'); do
              case "$library" in
                /usr/lib/*|/System/*) ;;
                # The tools' own libraries, found through their RPATH.
                "@rpath/libneura-core-$FULL.dylib"|"@rpath/libneura-sdk-$FULL.dylib") ;;
                *) echo "::error::$file needs $library"; status=1 ;;
              esac
            done
          done
          echo "minimum macOS version: $(otool -l stage/bin/neura | awk '/LC_BUILD_VERSION/ { found = 1 } found && /minos/ { print $2; exit }')"
          exit "$status"

      # The server components' C functions stay inside the tools and
      # libneura-core (hidden visibility, and on Linux --exclude-libs as
      # well), so a program that loads its own OpenSSL or libpq through C
      # import binds to its own copy. On macOS the assembly routines of
      # OpenSSL are global symbols of the objects; the check covers the C
      # interfaces there.
      - name: Require the server components to stay private
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os != 'Windows' }}
        run: |
          status=0
          if [ "$RUNNER_OS" = Linux ]; then
            files="stage/bin/* stage/lib/neura/*.so stage/lib/neura/launchers/*/*"
            pattern='^(SSL_|SSL_CTX_|EVP_|OPENSSL_|CRYPTO_|OSSL_|ossl_|X509_|BIO_|ERR_|PEM_|BN_|RSA_|EC_|PQ|pq|pg_|nghttp2_)'
          else
            files="stage/bin/* stage/lib/neura/*.dylib"
            pattern='^_(SSL_|SSL_CTX_|EVP_|X509_|BIO_|PEM_|OSSL_|PQ|pg_|nghttp2_)'
          fi
          for file in $files; do
            if [ "$RUNNER_OS" = Linux ]; then
              names=$(nm -D --defined-only "$file" 2> /dev/null | awk '{ print $NF }' || true)
            else
              names=$(nm -gU "$file" 2> /dev/null | awk '{ print $NF }' || true)
            fi
            exported=$(printf '%s\n' "$names" | grep -E "$pattern" || true)
            if [ -n "$exported" ]; then
              echo "::error::$file exports $(printf '%s\n' "$exported" | wc -l | tr -d ' ') server component symbols, such as $(printf '%s\n' "$exported" | head -n 3 | tr '\n' ' ')"
              status=1
            fi
          done
          exit "$status"

      - name: Require the documented PE imports, DLL exports and static CRT
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        run: |
          python scripts/check-core-closure.py build
          sh scripts/check-kernels.sh build
          python scripts/check-windows-binaries.py build --stage stage --service-bin stage-service/bin

      - name: Build and hash the cross-host test images
        if: ${{ matrix.triple == 'x86_64-linux-gnu' || runner.os == 'Windows' }}
        run: |
          tool=stage/bin/neura
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          mkdir identity
          for source in examples/hello-world/hello-world.nra examples/types/class-hooks.nra examples/concurrency/monitor.nra; do
            "$tool" build --no-source-map "$source" -o "identity/$(basename "$source" .nra).nvr"
          done
          (cd identity && sha256sum *.nvr) | tee image-sha256.txt

      - name: Upload the cross-host image hashes
        if: ${{ matrix.triple == 'x86_64-linux-gnu' || runner.os == 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-hashes-${{ matrix.triple }}
          path: image-sha256.txt
          if-no-files-found: error

      # The archive sizes against rc.3's archive, before the tests: on the
      # slower targets the packing below comes hours later. Only a report;
      # check 14 of packaging/qualify.sh, with its per-target budget, is the
      # gate.
      - name: Report the archive sizes before the tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os != 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p early/dist early/reference
          for product in sdk runtime legacy; do
            case "$product" in
              runtime) parts="--service stage-service" ;;
              *) parts="--sdk stage-sdk" ;;
            esac
            SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) sh packaging/make-archive.sh --product "$product" \
              --core stage-core $parts --build "$GITHUB_SHA" early/dist "$FULL" "$TRIPLE" > /dev/null
          done
          ls -l early/dist
          reference="neura-0.2.1-rc.3-$TRIPLE.tar.gz"
          if gh release download v0.2.1-rc.3 --repo "$GITHUB_REPOSITORY" --dir early/reference --pattern "$reference"; then
            size=$(wc -c < "early/reference/$reference" | tr -d ' ')
            echo "reference $reference: $size bytes"
            for file in early/dist/*.tar.gz; do
              actual=$(wc -c < "$file" | tr -d ' ')
              echo "$(basename "$file"): $actual bytes ($((actual * 100 / size))% of the reference)"
            done
          fi

      # Trials only: evidence before the hours of the full suite, whose log
      # can be read only once the job ends. The tests that were red in
      # earlier trials, and the qualification checks on the archives packed
      # above (on this runner, not a new one as the qualify job does), are
      # uploaded at once. Neither decides the job: the full suite and the
      # qualify job do.
      - name: Run the earlier trials' red tests (trials only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' && runner.os != 'Windows' }}
        continue-on-error: true
        run: >
          ctest --test-dir build --parallel "$JOBS" --output-on-failure
          -R '^(project-resolve|stdlib-net-socket|server-http-tls|server-worker-channel|server-host|server-host-h2c|server-sql|service-protocol|service-run|service-login|service-worker)$'
          2>&1 | tee early/red-tests.txt; test "${PIPESTATUS[0]}" = 0

      - name: Qualify the packed archives on this runner (trials only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' && runner.os != 'Windows' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v0.2.1-rc.3 v0.2.0; do
            mkdir -p "early/bridge/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "early/bridge/$tag" --pattern "neura-${tag#v}-$TRIPLE.tar.gz"
          done
          rc3="early/bridge/v0.2.1-rc.3/neura-0.2.1-rc.3-$TRIPLE.tar.gz"
          sh packaging/qualify.sh --archive "early/dist/neura-$FULL-$TRIPLE.tar.gz" \
            --sdk-archive "early/dist/neura-sdk-$FULL-$TRIPLE.tar.gz" \
            --runtime-archive "early/dist/neura-runtime-$FULL-$TRIPLE.tar.gz" --version "$FULL" --triple "$TRIPLE" \
            --examples examples --bridge "$rc3" --bridge "early/bridge/v0.2.0/neura-0.2.0-$TRIPLE.tar.gz" \
            --size-reference "$rc3" --previous "$rc3" --require-previous --require-bridge --server-components \
            2>&1 | tee early/qualify.txt; test "${PIPESTATUS[0]}" = 0

      - name: Upload the early evidence (trials only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'workflow_dispatch' && runner.os != 'Windows' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-early-${{ matrix.triple }}
          path: |
            early/red-tests.txt
            early/qualify.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Allow unprivileged user namespaces
        if: ${{ runner.os == 'Linux' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        env:
          EXCLUDE: ${{ matrix.exclude }}
        run: >
          ctest --test-dir build --parallel "$JOBS" --no-tests=error
          --output-on-failure --output-junit ctest-junit.xml -E "$EXCLUDE"

      - name: Require every test to have run
        if: ${{ !cancelled() }}
        env:
          MINIMUM: ${{ matrix.minimum }}
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" scripts/check-test-report.py build/ctest-junit.xml --minimum "$MINIMUM"

      - name: Require the built version to be the planned one
        run: |
          tool=stage/bin/neura
          if [ "$RUNNER_OS" = Windows ]; then tool="$tool.exe"; fi
          reported=$("$tool" --version)
          echo "$reported"
          case "$reported" in
            "neura $FULL ($TRIPLE, commit $GITHUB_SHA)") ;;
            *) echo "::error::expected neura $FULL ($TRIPLE, commit $GITHUB_SHA)"; exit 1 ;;
          esac

      # Neura-sdk, Neura-runtime, and (on POSIX) the legacy archive that 0.2
      # updaters read: the tree of the SDK archive under the 0.2 name.
      - name: Pack the archives
        run: |
          mkdir dist
          set -- sdk runtime
          if [ "$RUNNER_OS" != Windows ]; then set -- "$@" legacy; fi
          for product do
            case "$product" in
              runtime) parts="--service stage-service" ;;
              *) parts="--sdk stage-sdk" ;;
            esac
            SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) sh packaging/make-archive.sh --product "$product" \
              --core stage-core $parts --build "$GITHUB_SHA" dist "$FULL" "$TRIPLE"
          done
          ls -l dist

      # The size report of the baseline: each executable's and library's
      # stripped size, and each archive's size (the qualify job checks the
      # archives against rc.3's).
      - name: Report the sizes
        if: ${{ runner.os != 'Windows' }}
        run: |
          mkdir sizes
          for file in $(find stage-core stage-sdk stage-service -type f \( -perm -u+x -o -name '*.so' -o -name '*.dylib' \) | sort); do
            cp "$file" sizes/item
            strip sizes/item 2> /dev/null || true
            printf '%s %s stripped %s\n' "$file" "$(wc -c < "$file" | tr -d ' ')" "$(wc -c < sizes/item | tr -d ' ')"
          done | tee sizes.txt
          ls -l dist | tee -a sizes.txt

      - name: Report the Windows binary and archive sizes
        if: ${{ runner.os == 'Windows' }}
        run: ls -l stage/bin/*.exe stage/bin/*.dll stage-service/bin/*.exe dist/*.tar.gz | tee sizes.txt

      - name: Upload the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.triple }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build log and the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-build-${{ matrix.triple }}
          path: |
            sizes.txt
            build/build.log
            build/ctest-junit.xml
            build/Testing/Temporary/LastTest.log
            server-components.log
          if-no-files-found: warn
          retention-days: 90

  image-identity:
    name: Compare Linux and Windows image hashes
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the image hashes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-hashes-*
          path: identity
      - name: Require byte-identical images
        run: diff -u identity/image-hashes-x86_64-linux-gnu/image-sha256.txt identity/image-hashes-x86_64-windows-msvc/image-sha256.txt

  qualify:
    name: Qualify the archive (${{ matrix.triple }})
    needs: [plan, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-linux-gnu
            runner: ubuntu-24.04
          - triple: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
          - triple: aarch64-apple-darwin
            runner: macos-15
          - triple: x86_64-apple-darwin
            runner: macos-15-intel
          - triple: x86_64-windows-msvc
            runner: windows-2022
    env:
      FULL: ${{ needs.plan.outputs.full }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - name: Keep LF line endings before checkout
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: git config --global core.autocrlf false

      # Only the qualification script and the examples are used from the
      # checkout. Nothing is built on this runner.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.triple }}
          path: dist

      - name: Select Python for Windows qualification
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Download the same-build Linux archive size references
        if: ${{ runner.os == 'Windows' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-x86_64-linux-gnu
          path: reference

      # A target that the previous release did not have has nothing to
      # update from, and its upgrade check is reported as not run. A 0.3
      # release has three archives; the upgrade starts from its SDK archive,
      # and from a 0.2 release's only archive.
      - name: Download the previous release's archive
        if: ${{ runner.os != 'Windows' && env.PREVIOUS != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous --pattern SHA256SUMS
          version=${PREVIOUS#v}
          for file in "neura-sdk-$version-$TRIPLE.tar.gz" "neura-$version-$TRIPLE.tar.gz"; do
            if grep -F -- "  $file" previous/SHA256SUMS > previous/expected; then
              gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous --pattern "$file"
              (cd previous && shasum -a 256 --check expected)
              echo "$file" > previous/chosen
              break
            fi
          done
          [ -f previous/chosen ] || echo "$PREVIOUS has no archive for $TRIPLE"

      - name: Download the previous Windows SDK archive when available
        if: ${{ runner.os == 'Windows' && env.PREVIOUS != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous --pattern SHA256SUMS
          file="neura-sdk-${PREVIOUS#v}-$TRIPLE.tar.gz"
          awk -v file="$file" '$2 == file' previous/SHA256SUMS > previous/expected
          if [ -s previous/expected ]; then
            gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --dir previous --pattern "$file"
            (cd previous && sha256sum --check expected)
            echo "$file" > previous/chosen
          else
            echo "$PREVIOUS has no archive for $TRIPLE"
          fi

      # The 0.2 bridge (docs/design/Lifecycle030.md): the published 0.2
      # clients update into this release with their own neura update, then
      # migrate. rc.3 is also the size reference of the baseline.
      - name: Download the 0.2 archives for the bridge
        if: ${{ runner.os != 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir bridge
          for tag in v0.2.1-rc.3 v0.2.0; do
            file="neura-${tag#v}-$TRIPLE.tar.gz"
            mkdir "bridge/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "bridge/$tag" --pattern SHA256SUMS --pattern "$file"
            (cd "bridge/$tag" && grep -F -- "  $file" SHA256SUMS | shasum -a 256 --check)
          done

      - name: Run the lifecycle checks (Linux and macOS)
        if: ${{ runner.os != 'Windows' }}
        run: |
          set -- --archive "dist/neura-$FULL-$TRIPLE.tar.gz" --sdk-archive "dist/neura-sdk-$FULL-$TRIPLE.tar.gz" \
            --runtime-archive "dist/neura-runtime-$FULL-$TRIPLE.tar.gz" --version "$FULL" --triple "$TRIPLE" --examples examples \
            --bridge "bridge/v0.2.1-rc.3/neura-0.2.1-rc.3-$TRIPLE.tar.gz" --bridge "bridge/v0.2.0/neura-0.2.0-$TRIPLE.tar.gz" \
            --size-reference "bridge/v0.2.1-rc.3/neura-0.2.1-rc.3-$TRIPLE.tar.gz"
          if [ -f previous/chosen ]; then
            set -- "$@" --previous "previous/$(cat previous/chosen)" --require-previous
          fi
          # A trial builds a -dev version, which may sort before rc.3; a tag
          # must update from both 0.2 clients.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            set -- "$@" --require-bridge
          fi
          # Every archive links the server components (the build job above).
          set -- "$@" --server-components
          sh packaging/qualify.sh "$@" | tee "qualify-$TRIPLE.txt"

      - name: Run the lifecycle checks (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: |
          set -- --sdk-archive "dist/neura-sdk-$FULL-$TRIPLE.tar.gz" --runtime-archive "dist/neura-runtime-$FULL-$TRIPLE.tar.gz" \
            --version "$FULL" --triple "$TRIPLE" --examples examples \
            --size-reference-sdk "reference/neura-sdk-$FULL-x86_64-linux-gnu.tar.gz" \
            --size-reference-runtime "reference/neura-runtime-$FULL-x86_64-linux-gnu.tar.gz"
          if [ -f previous/chosen ]; then
            set -- "$@" --previous "previous/$(cat previous/chosen)" --require-previous
          fi
          python packaging/qualify.py "$@" 2>&1 | tee "qualify-$TRIPLE.txt"

      - name: Upload the qualification report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-qualify-${{ matrix.triple }}
          path: qualify-${{ matrix.triple }}.txt
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Publish
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [plan, build, qualify, image-identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      FULL: ${{ needs.plan.outputs.full }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the qualified archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Add the install scripts and write the release metadata
        run: |
          cp packaging/bootstrap.sh dist/install.sh
          cp packaging/bootstrap.ps1 dist/install.ps1
          sh packaging/make-release-metadata.sh dist "$FULL"
          cat dist/SHA256SUMS dist/neura-release.txt dist/neura-components.txt

      - name: Attest the build provenance of each file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Write the release notes
        run: python3 scripts/release-notes.py "$FULL" > notes.md

      # A release candidate is published as a prerelease at once. A final
      # version stays a draft: a maintainer publishes it after the manual
      # verification in docs/ReleaseProcess.md.
      - name: Create the release
        run: |
          if [ -n "$PRERELEASE" ]; then
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Neura $FULL" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Neura $FULL" --notes-file notes.md --draft
          fi

      - name: Download the release's files and verify them
        run: |
          mkdir check
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir check
          (cd check && sha256sum --check SHA256SUMS)
          for file in check/*.tar.gz check/install.sh check/install.ps1; do
            cmp "$file" "dist/$(basename "$file")"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done
          cmp check/SHA256SUMS dist/SHA256SUMS
          cmp check/neura-release.txt dist/neura-release.txt
          cmp check/neura-components.txt dist/neura-components.txt

      # A published release candidate can be downloaded by anyone, so the
      # documented install command is run against it as a user would. A final
      # version is still a draft here; docs/ReleaseProcess.md has the
      # maintainer run the command after publishing it.
      - name: Install the published candidate with the one-line command
        if: ${{ env.PRERELEASE != '' }}
        run: |
          home=$(mktemp -d)
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" |
            env -i HOME="$home" PATH=/usr/bin:/bin GH_TOKEN="$GH_TOKEN" sh -s -- --version "$FULL" | tee install.log
          # The token lets gh check the attestation, so the check must have run.
          grep -F "Verified: build provenance" install.log
          reported=$(env -i HOME="$home" PATH="$home/.local/bin:/usr/bin:/bin" neura --version)
          echo "$reported"
          case "$reported" in
            "neura $FULL (x86_64-linux-gnu, commit $GITHUB_SHA)") ;;
            *) echo "::error::the installed neura is not $FULL built from $GITHUB_SHA"; exit 1 ;;
          esac
          env -i HOME="$home" PATH="$home/.local/bin:/usr/bin:/bin" neura doctor

  install-candidate-windows:
    name: Install the published candidate (Windows)
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && needs.plan.outputs.prerelease != '' }}
    needs: [plan, publish]
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      FULL: ${{ needs.plan.outputs.full }}
    steps:
      - name: Install the candidate with the PowerShell command
        shell: pwsh
        run: |
          $env:NEURA_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'neura-candidate'
          $uri = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/install.ps1"
          $install = & ([scriptblock]::Create((Invoke-RestMethod $uri))) -Version $env:FULL -NoPathUpdate
          $install | Write-Output
          if (-not ($install | Select-String -SimpleMatch 'Verified: build provenance')) {
            throw 'The installer did not verify the archive attestation'
          }
          $neura = Join-Path $env:NEURA_INSTALL_ROOT 'current/bin/neura.exe'
          $reported = & $neura --version
          if ($LASTEXITCODE -ne 0 -or $reported -ne "neura $env:FULL (x86_64-windows-msvc, commit $env:GITHUB_SHA)") {
            throw "Unexpected installed version [$reported]"
          }
          & $neura doctor
