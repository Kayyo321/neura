name: Editor tooling
on:
  push:
    branches: ['codex/vscode-tooling-rc']
  pull_request:
    paths: ['src/tooling/**', 'tests/tooling/**', 'src/cli/**', 'src/lexer/**', 'src/parser/**', 'src/util/source_map*', 'src/nvm/machine*', 'CMakeLists.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  protocols:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libffi-dev ninja-build
      - if: runner.os == 'macOS'
        run: brew install libffi ninja pkg-config
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export PKG_CONFIG_PATH="$(brew --prefix libffi)/lib/pkgconfig"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure -R 'tooling-|source-docs|diagnostics|version-consistency'
