# Tier 1: the checks every pull request must pass before it is merged.
# docs/ContinuousIntegration.md describes each job and how to run it locally.
#
# This workflow runs code from pull requests, including pull requests from
# forks. It holds no secrets and its token can only read the repository.
name: Tier 1

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # `shell: bash` runs each script with `-e -o pipefail`.
    shell: bash

jobs:
  repository:
    name: Documentation and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the check scripts
        run: python3 scripts/test-checks.py

      - name: Check the workflow rules
        run: python3 scripts/check-workflows.py

      - name: Check documentation links
        run: python3 scripts/check-docs.py

      - name: Check the diagnostic codes, their pages, and their tests
        run: python3 scripts/check-diagnostics.py

      - name: Check the standard library reference pages
        run: python3 scripts/update-stdlib-wiki-api.py --check

      - name: Check that the wiki pages are generated from docs
        run: python3 scripts/generate-wiki.py --check

      - name: Check that the kernel table, reference, and declarations are generated
        run: python3 scripts/gen-kernels.py --check
      - name: Check the website
        run: python3 scripts/build-site.py --check

  build-and-test:
    name: Build and test (Linux x86-64)
    runs-on: ubuntu-24.04
    # The 0.3.0 suite takes about 55 minutes on this runner (release trial 21's
    # x86-64 Linux leg: 3,152 s of tests) after a 6-minute build; 120 leaves
    # room for a busy runner.
    timeout-minutes: 120
    env:
      CC: gcc-14
      CXX: g++-14
      # A test that needs libclang fails instead of being skipped.
      NEURA_LIBCLANG_REQUIRED: "1"
      # native-install fails instead of leaving out its empty-root checks.
      NEURA_USERNS_REQUIRED: "1"
    steps:
      - name: Check out the repository and its submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-14 g++-14 libffi-dev libclang1-19 libclang-common-19-dev gnupg

      # This job builds with the server components of the release archives
      # (TLS, HTTP/2 and the PostgreSQL provider), so every pull request runs
      # the HTTPS, HTTP/2 and PostgreSQL tests. The built libraries are
      # cached under a key of the component lock and the script that builds
      # them; release.yml rebuilds them from verified sources every time.
      - name: Restore the server components
        id: server-components
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/server-components
          key: server-components-${{ runner.os }}-${{ runner.arch }}-gcc-14-${{ hashFiles('packaging/server-components.lock.toml', 'packaging/build-server-components.sh', 'packaging/server-component-keys/*.asc') }}

      - name: Build the server components
        if: ${{ steps.server-components.outputs.cache-hit != 'true' }}
        run: sh packaging/build-server-components.sh --jobs "$(nproc)" "$HOME/server-components"

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEURA_TEST_FRAME_HOOKS=ON
          -DNEURA_ENABLE_SERVER_TLS=ON "-DOPENSSL_ROOT_DIR=$HOME/server-components/openssl"
          -DNEURA_ENABLE_SERVER_HTTP2=ON "-DNEURA_NGHTTP2_ROOT=$HOME/server-components/nghttp2"
          -DNEURA_ENABLE_POSTGRES=ON "-DNEURA_LIBPQ_SOURCE=$HOME/server-components/postgresql"
          "-DNEURA_LIBPQ_BUILD=$HOME/server-components/postgresql"
          "-DNEURA_COMPONENT_LICENSES=$HOME/server-components/licenses"
          "-DNEURA_SERVER_TEST_OPENSSL=$HOME/server-components/openssl/bin/openssl"
          -DNEURA_TEST_TIMEOUT_SCALE=3

      - name: Build
        run: cmake --build build --parallel "$(nproc)" 2>&1 | tee build/build.log

      - name: Require a build of Neura's sources without compiler warnings
        run: |
          if grep -F "warning:" build/build.log | grep -v -F "/third_party/"; then
            echo "::error::The build reported the compiler warnings above in Neura's sources."
            exit 1
          fi

      - name: Check that the kernels call no libm or stateful libc function
        run: scripts/check-kernels.sh build

      - name: Check that the execution core links no compiler code
        run: python3 scripts/check-core-closure.py build

      # The runner's AppArmor profile forbids unprivileged user namespaces,
      # which native-install uses to run a static executable in an empty root.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        run: >
          ctest --test-dir build --parallel "$(nproc)" --no-tests=error
          --output-on-failure --output-junit ctest-junit.xml

      - name: Require every test to have run
        if: ${{ !cancelled() }}
        run: python3 scripts/check-test-report.py build/ctest-junit.xml --minimum 327

      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier1-test-report
          path: |
            build/build.log
            build/ctest-junit.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  # The execution core alone (docs/design/Products030.md): a build without
  # the SDK needs neither the libclang submodule nor any compiler library.
  runtime-only:
    name: Runtime-only build (Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Check out the repository without its submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-14 g++-14 libffi-dev

      - name: Configure without the SDK
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEURA_SDK=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)" 2>&1 | tee build/build.log

      - name: Require a build of Neura's sources without compiler warnings
        run: |
          if grep -F "warning:" build/build.log | grep -v -F "/third_party/"; then
            echo "::error::The build reported the compiler warnings above in Neura's sources."
            exit 1
          fi

      - name: Check the core tools and their components
        run: |
          python3 scripts/check-core-closure.py build
          cmake --install build --component core --prefix stage
          stage/bin/neura --version
          stage/bin/neura doctor
          if stage/bin/neura build x.nra -o x.nvr 2> build/missing.txt; then
            echo "::error::neura build succeeded without the SDK"
            exit 1
          fi
          grep -F "part of the Neura-sdk component" build/missing.txt

  # Added provisionally: add these to tier1.needs after the first green
  # Windows run. Interpreter-only Windows uses the same scale as macOS/arm64.
  build-and-test-windows:
    name: Build and test (Windows x86-64)
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Keep LF line endings before checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out the repository and its submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select the Windows build environment
        uses: ./.github/actions/windows
      - name: Run the repository checks on Windows
        run: |
          python scripts/test-checks.py
          python scripts/check-workflows.py
          python scripts/check-docs.py
          python scripts/check-diagnostics.py
          python scripts/update-stdlib-wiki-api.py --check
          python scripts/generate-wiki.py --check
          python scripts/gen-kernels.py --check
          python scripts/build-site.py --check
      - name: Configure
        run: cmake --preset windows-msvc -DNEURA_TEST_TIMEOUT_SCALE=12 -DNEURA_TEST_FRAME_HOOKS=ON
      - name: Build
        run: cmake --build --preset windows-msvc --parallel 4 2>&1 | tee build-windows-msvc/build.log
      - name: Require an MSVC build without Neura compiler warnings
        shell: pwsh
        run: ./.github/scripts/check-msvc-warnings.ps1 build-windows-msvc/build.log
      - name: Check the execution core, kernels and PE layout
        run: |
          python scripts/check-core-closure.py build-windows-msvc
          sh scripts/check-kernels.sh build-windows-msvc
          python scripts/check-windows-binaries.py build-windows-msvc
      # Without the JIT these suites took about 400 of 494 test-minutes in an
      # arm64 macOS run. Tier 2 and release.yml run the excluded lifetime
      # fixtures and other slow entries on Windows, with the same crypto
      # exceptions as x86-64 macOS. 315 is the historical minimum here.
      - name: Test
        run: >
          ctest --test-dir build-windows-msvc --parallel 6 --no-tests=error
          --output-on-failure --output-junit ctest-junit.xml
          -E "^(stdlib-crypto-asymmetric|stdlib-crypto-advanced|stdlib-crypto-pqc(-.*)?|stdlib-crypto-token|stdlib-crypto-enclave|stdlib-crypto-pki|stdlib-character|backend-reference|lifetime-programs-.*)$"
      - name: Require every selected test to have run
        if: ${{ !cancelled() }}
        run: python scripts/check-test-report.py build-windows-msvc/ctest-junit.xml --minimum 315
      - name: Build an image for the runtime-only job
        run: build-windows-msvc/neura.exe build examples/hello-world/hello-world.nra -o hello-windows.nvr
      - name: Upload the runtime-only input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-input
          path: hello-windows.nvr
          if-no-files-found: error
      - name: Upload the build and test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tier1-windows
          path: |
            build-windows-msvc/build.log
            build-windows-msvc/ctest-junit.xml
            build-windows-msvc/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

  runtime-only-windows:
    name: Runtime-only build (Windows x86-64)
    needs: build-and-test-windows
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Keep LF line endings before checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Check out the repository without its submodule
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the Windows build environment
        uses: ./.github/actions/windows
      - name: Download the SDK-built image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-runtime-input
      - name: Configure without the SDK
        run: cmake --preset windows-msvc -DNEURA_SDK=OFF -DBUILD_TESTING=OFF
      - name: Build
        run: cmake --build --preset windows-msvc --parallel 4 2>&1 | tee build-windows-msvc/build.log
      - name: Require an MSVC build without Neura compiler warnings
        shell: pwsh
        run: ./.github/scripts/check-msvc-warnings.ps1 build-windows-msvc/build.log
      - name: Check the runtime-only installation
        run: |
          python scripts/check-core-closure.py build-windows-msvc
          cmake --install build-windows-msvc --component core --prefix stage
          stage/bin/neura.exe --version
          stage/bin/neura.exe doctor
          stage/bin/neura.exe run hello-windows.nvr | tee hello.txt
          grep -Fx 'Hello, World!' hello.txt
          if stage/bin/neura.exe build x.nra -o x.nvr 2> missing.txt; then exit 1; fi
          grep -F 'part of the Neura-sdk component' missing.txt

  # The one status check that branch rules require. It fails unless every
  # job above succeeded, so a skipped or cancelled job cannot pass for it.
  tier1:
    name: Tier 1
    if: ${{ always() }}
    needs:
      - repository
      - build-and-test
      - runtime-only
      - build-and-test-windows
      - runtime-only-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          python3 - <<'EOF'
          import json, os, sys
          results = {job: outcome["result"] for job, outcome in json.loads(os.environ["RESULTS"]).items()}
          failed = {job: result for job, result in results.items() if result != "success"}
          for job, result in sorted(failed.items()):
              print(f"::error::Job `{job}` ended as `{result}`; Tier 1 requires `success`.")
          sys.exit(1 if failed or not results else 0)
          EOF
