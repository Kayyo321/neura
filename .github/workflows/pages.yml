# Pages: builds the website from site/ and publishes it with GitHub Pages.
# docs/Site.md describes the site, how to change it, and the repository
# settings this workflow depends on.
#
# This workflow runs for commits on main and never for a pull request. Its
# deploy job is the only job in the repository whose token can write, and
# that token can write only a Pages deployment.
name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A run that is deploying finishes; of the runs
# waiting behind it, only the newest starts.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    # `shell: bash` runs each script with `-e -o pipefail`.
    shell: bash

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading the Pages configuration gives the path the site is served below.
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build and check the site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/build-site.py --output _site --base-path "$BASE_PATH"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Create the deployment.
      pages: write
      # Prove to Pages which repository and branch the deployment comes from.
      id-token: write
    # The environment's branch rule refuses a deployment from any branch but main.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the uploaded site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
