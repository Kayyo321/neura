name: Documentation problem
description: A page in docs/, the wiki, or the website is wrong, unclear, incomplete, or disagrees with what Neura does.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page and section
      description: The file path, wiki page, or website address, and the heading.
      placeholder: docs/lang/Numbers.md, "Integer arithmetic"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the text. If it disagrees with the implementation, show the program and the output that contradict it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should say
      description: The correction, or the question the page leaves unanswered.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Neura commit
      description: The commit you read or tested against, when the problem is a disagreement with the implementation.
