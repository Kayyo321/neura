name: Bug report
description: Neura rejects a valid program, accepts an invalid one, produces a wrong result, crashes, or fails to build.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report a security vulnerability privately instead: see [SECURITY.md](https://github.com/Kayyo321/neura/blob/main/SECURITY.md).
  - type: textarea
    id: reproducer
    attributes:
      label: Smallest input that reproduces it
      description: The `.nra` source, `.nir` file, `.nvr` image, assembly text, or C header, reduced as far as you can. Attach binary files.
      render: text
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands
      description: The exact commands you ran, including every `--allow-*` and `--max-*` option, and any input the program read.
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen, and the specification page or section that says so if you know it.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: The output, diagnostic, exit status, or trap. Paste text; do not paraphrase a diagnostic.
      render: text
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: First stage where the result is wrong
      description: Choose "Unknown" unless you have checked. `neura emit-ir` shows the lowered NeuraIR and `--no-optimize` skips IR optimization.
      options:
        - Unknown
        - C import
        - Lexer
        - Parser
        - NeuraIR (name resolution, typing, lowering)
        - IR optimization
        - IRtoNeuronConversion
        - Output (.nir or .nvr writing and loading)
        - NVM runtime or host services
        - Standard library
        - Decompiler or assembler
        - Command-line interface
        - Build system
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Neura commit
      description: The output of `git rev-parse HEAD` in the checkout you built.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and version, processor architecture, and C++ compiler and version.
      placeholder: Debian 13, x86-64, GCC 14.2
    validations:
      required: true
  - type: textarea
    id: replay
    attributes:
      label: Replay information
      description: For a runtime problem that depends on files, the network, the clock, or other host input, attach a trace recorded with `neura run --record trace.txt`.
