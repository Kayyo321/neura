name: Security report
description: A crafted input corrupts memory, or a running program gets past a capability or a limit. This report is public.
title: "Security: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security reports are public, and [SECURITY.md](https://github.com/Kayyo321/neura/blob/main/SECURITY.md) lists what is in scope. Leave out credentials, personal data, and anything else that is not yours to publish.
  - type: dropdown
    id: boundary
    attributes:
      label: Boundary that failed
      options:
        - Reading input (memory corruption or undefined behavior from a crafted file)
        - Capabilities (a host service reached without its --allow-* option, or outside an --allow-fs prefix)
        - Limits (a frame, heap, or step limit exceeded without a trap, or unbounded host memory)
        - Replay (a replayed run reached a real host service)
        - Other
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Smallest input that triggers it
      description: The `.nra` source, `.nir` file, `.nvr` image, assembly text, C header, or recorded trace, reduced as far as you can. Attach binary files.
      render: text
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands
      description: The exact commands you ran, including every `--allow-*` and `--max-*` option.
      render: sh
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened and what you expected
      description: Paste the output, diagnostic, exit status, trap, or sanitizer report.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: What an attacker gains
      description: What someone who controls the input or the program can read, write, run, or exhaust.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Neura commit
      description: The output of `git rev-parse HEAD` in the checkout you built.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and version, processor architecture, and C++ compiler and version.
      placeholder: Debian 13, x86-64, GCC 14.2
    validations:
      required: true
