# The project manifest (docs/apps/Projects.md). Build a target with `neura build --target <name>`.
schema = 1

[project]
name = "{{name}}"
id = "{{id}}"
version = "0.1.0"
language = "0.3"

[packages.ui]
root = "ui"

[packages.desktop]
root = "desktop"

[targets.web]
kind = "web"
package = "ui"
entry = "Ui.Main"
styles = ["ui/base.css"]
capabilities = ["ui", "bridge"]

[targets.desktop]
kind = "desktop"
package = "desktop"
ui = "web"
entry = "Desktop.Main"
capabilities = ["desktop"]

[targets.desktop.bridge]
operations = ["app.echo"]

[targets.desktop.packaging]
icon = "desktop/icon.png"
formats = ["tar.gz", "deb"]
