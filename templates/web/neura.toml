# The project manifest (docs/apps/Projects.md). Build a target with `neura build --target <name>`.
schema = 1

[project]
name = "{{name}}"
id = "{{id}}"
version = "0.1.0"
language = "0.3"

[packages.ui]
root = "ui"

[targets.web]
kind = "web"
package = "ui"
entry = "Ui.Main"
styles = ["ui/base.css"]
capabilities = ["ui"]
