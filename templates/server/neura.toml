# The project manifest (docs/apps/Projects.md). Build a target with `neura build --target <name>`.
schema = 1

[project]
name = "{{name}}"
id = "{{id}}"
version = "0.1.0"
language = "0.3"

[packages.server]
root = "server"

[targets.server]
kind = "server"
package = "server"
entry = "Server.Main"
capabilities = ["http_server", "app"]

[targets.server.http]
listen = "127.0.0.1:8080"
